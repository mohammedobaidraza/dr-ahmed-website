[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.tile.openstreetmap.org; frame-ancestors 'none';"

# Long-term caching for Next.js static assets (content-hashed filenames)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect www → apex (drmohammedahmed.com is canonical)
[[redirects]]
  from = "https://www.drmohammedahmed.com/*"
  to   = "https://drmohammedahmed.com/:splat"
  status = 301
  force  = true

# Redirect alias domain → canonical domain (avoids duplicate content)
[[redirects]]
  from = "https://ahmedhipknee.com/*"
  to   = "https://drmohammedahmed.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.ahmedhipknee.com/*"
  to   = "https://drmohammedahmed.com/:splat"
  status = 301
  force  = true
